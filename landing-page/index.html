<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="home">

        <div class="diagonal-background"></div>

        <header>
            <div class="form-logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Tutorly</span>
            </div>

            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#features">Features</a>
                <a href="#faq">FAQ</a>
            </nav>

            <div class="current-language">
                <img src="images/uk.svg">
                <span>ENG</span> 
            </div>
        </header>

        <div class="hero-content">
            <div class="hero-left">
                <h1>Tutorly</h1>
                <br>
                <br>
                <p>Learn. Teach. Grow.</p>
                <br>
                <p>Tutorly is a platform where you can teach and absorb all the knowledge with your peers.</p>
                <br>
                <p>Connect with students and tutors worldwide through one modern learning platform.</p>

                <div class="buttons">
                    
                    <button>LEARN MORE</button>
                    <button class="sign-up-bttn">SIGN UP</button>
                </div>

            </div>
            <div class="hero-right">
                <img src="images/students.svg">
            </div>
        </div>

    </section>
    
    <script src="script.js"></script>
</body>
</html>
